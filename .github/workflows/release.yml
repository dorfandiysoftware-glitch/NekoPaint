name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag, e.g. v0.2.0-test1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core tests
        run: gradle :core:test
      - name: Debug APK
        run: gradle :app:assembleDebug
      - name: Name the APK
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/*.apk "out/NekoPaint-${{ github.event.inputs.version }}-debug.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: NekoPaint ${{ github.event.inputs.version }}
          prerelease: true
          files: out/*.apk
